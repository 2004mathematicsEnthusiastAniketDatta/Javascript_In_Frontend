<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS_Grids</title>
    <style>
        #parent{
            height: fit-content;
            width: 100%;
            display: grid;
            grid-template-rows: repeat(4,15em);
            grid-template-columns: repeat(4,15em);
            border: 1px solid gray;
        }
        .child{
            border: 1px dashed;
        }
        #childA{
            grid-row: 1/1;
            grid-column: 1/4;
        }
        #child0{
           grid-row: 2/3;
           grid-column:1/4;
        }
        #child1{
           grid-area: 3/1/4/4; 
           /* grid-area: row-start/column-start/row-end/col-end; */           
        }
        #child2{
            grid-column-start: 1;
            grid-column-end: 4;
            grid-row-start:4;
            grid-row-end: 5;
        }
        #child3{
            grid-column-start:4;
            grid-column-end: 5;
            grid-row-start: 1;
            grid-row-end: 5;
        }
    </style>
</head>
<body>
     <div id="parent">
        <div id="childA" class="child">Item 0</div>
        <div id="child0" class="child">Item 1</div>
        <div id="child1" class="child">Item 2</div>
        <div id="child2" class="child">Item 3</div>
        <div id="child3" class="child">Item 4</div>
     </div>
</body>
</html>
