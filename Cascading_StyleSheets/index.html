<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GNU/Linux Terminal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="terminal">
        <div class="terminal-header">
            <span class="terminal-title">GNU/Linux Terminal</span>
            <button class="close-button">X</button>
        </div>
        <div class="terminal-body">
            <div class="terminal-output">
                <p>Welcome to GNU/Linux Terminal!</p>
                <p>Type 'help' for a list of available commands.</p>
            </div>
            <div class="terminal-input">
                <input type="text" id="command-input" placeholder="$">
                <button id="execute-button">Execute</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
