<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container {
  display: flex; /* enable Flexbox */
  flex-direction: row; /* arrange cards horizontally */
  justify-content: flex-start; /* align cards to the left */
  align-items: center; /* center cards vertically */
}

.card {
  width: 150px; /* set card width */
  height: 100px; /* set card height */
  background-color: #f0f0f0; /* set card background color */
  margin: 10px; /* add some spacing between cards */
  border: 1px solid #ddd; /* add a border to the cards */
}

    </style>
</head>
<body>
    <div class="container">
        <div class="card">Card 1</div>
        <div class="card">Card 2</div>
        <div class="card">Card 3</div>
        <div class="card">Card 4</div>
        <div class="card">Card 5</div>
      </div>
      
</body>
</html>
